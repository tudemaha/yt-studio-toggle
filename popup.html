<!doctype html>
<html lang="en">
  <head>
    <link rel="stylesheet" href="popup.css" />
  </head>
  <body>
    <h1>Hide YT Studio Component</h1>
    <p>Toggle the switch to hide or show the components on YouTube Studio.</p>
    <div class="container">
      <ul>
        <li class="hide-list">
          <label for="monetization">Monetization</label>
          <input type="checkbox" id="monetization" />
        </li>
        <li class="hide-list">
          <label for="subscriber-count">Subscriber Count</label>
          <input type="checkbox" id="subscriber-count" />
        </li>
        <li class="hide-list">
          <label for="subscriber-list">Subscriber List</label>
          <input type="checkbox" id="subscriber-list" />
        </li>
        <li class="hide-list">
          <label for="analytics-card">Analytics Card</label>
          <input type="checkbox" id="analytics-card" />
        </li>
      </ul>
    </div>
    <footer>
      <p>
        Extension by
        <a href="https://github.com/tudemaha" target="_blank">Tude Maha</a>
      </p>
    </footer>
  </body>
</html>
